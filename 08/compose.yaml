name: pgcourse-hw08
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course_local
      POSTGRES_DB: course_hw08
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=50ms
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=200ms
      - -c
      - "log_line_prefix=%m [%p] session=%c db=%d user=%u app=%a state=%e qid=%Q "
    volumes:
      - data:/var/lib/postgresql
      - .:/work:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U course -d course_hw08]
      interval: 2s
      timeout: 3s
      retries: 40
volumes:
  data:
