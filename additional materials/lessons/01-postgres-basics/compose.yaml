name: postgres-live-students-01
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course_local
      POSTGRES_DB: course
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./:/work:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
