name: postgres-live-students-05
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course_local
      POSTGRES_DB: live5
      POSTGRES_INITDB_ARGS: --locale=en_US.utf8 --encoding=UTF8
    volumes:
      - live_data:/var/lib/postgresql
      - ./:/work:ro
    healthcheck:
      test: [CMD-SHELL, "psql -X -U course -d live5 -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 40
    shm_size: 256mb
volumes:
  live_data:
